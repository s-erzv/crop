name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_SHA: ${{ github.sha }}
        run: |
          cd backend
          git init
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          # exclude generated figures — frontend already has them in public/figures/
          # HF Spaces rejects untracked binary files without LFS/Xet
          git rm -r --cached model/figures/ 2>/dev/null || true
          git commit -m "sync from GitHub $GH_SHA"
          git remote add space https://nupers:$HF_TOKEN@huggingface.co/spaces/nupers/crop
          git push space HEAD:main --force
